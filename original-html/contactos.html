<section class="contact-hero">

<div class="contact-hero-content">

<h1>Contacto</h1>
<p>Entre em contacto para concertos, eventos ou colaborações</p>

</div>

<!-- FORMULÁRIO DE CONTACTO -->

<section class="contact-section">

<div class="container">

<h2 class="contact-title">Enviar Mensagem</h2>

<div class="contact-line"></div>

<div class="contact-container">

<!-- FORMULÁRIO -->

<form class="contact-form" id="contactForm">

<input type="text" id="nome" placeholder="Nome" required>

<input type="text" id="apelido" placeholder="Apelido" required>

<input type="date" id="nascimento" required>

<input type="email" id="email" placeholder="Email" required>

<input type="tel" id="telefone" placeholder="Telefone" required>

<textarea id="mensagem" placeholder="Mensagem" rows="5" required></textarea>

<button type="submit">Enviar Mensagem</button>

<p id="formMessage"></p>

</form>


<!-- INFORMAÇÕES -->

<div class="contact-info">

<h3>Management</h3>

<p>Email: management@seujorge.com</p>

<p>Booking: booking@seujorge.com</p>

<p>Press: press@seujorge.com</p>

<div class="contact-social">

<a href="#">Spotify</a>
<a href="#">YouTube</a>

</div>

</div>
